{% extends "base.html" %}
{% block content %}

<div class="single-column">
    <div class="header-section">
        <h1>ClinicScope AI</h1>
        <p>Paste a hospital, clinic, or medical center website URL. The AI will scrape, clean, and summarize its facilities, departments, and timings.</p>
    </div>

    <div class="card center-card">
        <form id="clinicscope-form" class="ai-form">
            <input type="url" id="clinic-url" placeholder="https://www.example-hospital.com" required>
            <button type="submit" class="primary-btn">Analyze Website</button>
        </form>
        
        <div id="clinic-loader" class="loader hidden">
            <div class="spinner"></div>
            <p>Scraping and summarizing context...</p>
        </div>
        
        <div id="clinic-result" class="result-box hidden"></div>
    </div>
</div>

{% endblock %}
