<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediPulse AI - Your Intelligent Health Companion</title>
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='logo.jpg') }}">
    <!-- Use vanilla CSS, no external frameworks requested -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="brand">
                <img src="{{ url_for('static', filename='logo.jpg') }}" alt="MediPulse Logo" class="brand-logo-img">
                MediPulse <span class="ai-text">AI</span>
            </a>
            <div class="nav-links">
                <a href="/">Dashboard</a>
                <a href="/doctor">Doctor & Care</a>
                <a href="/clinic">Clinic RAG</a>
            </div>
            <!-- Mobile Menu Toggle -->
            <div class="hamburger" id="hamburger">☰</div>
        </div>
    </nav>
    <div class="mobile-menu" id="mobile-menu">
        <a href="/">Dashboard</a>
        <a href="/doctor">Doctor & Care</a>
        <a href="/clinic">Clinic RAG</a>
    </div>

    <div id="global-emergency-banner" class="emergency-banner hidden">
        <strong>⚠️ EMERGENCY ALERT:</strong> <span id="emergency-text"></span>
    </div>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="footer-container">
            <p>&copy; 2026 MediPulse AI. Shravan Shidruk  All rights reserved.</p>
            <p class="footer-container">Application is for health awareness only. Not a replacement for professional medical advice.</p>
        </div>
    </footer>

    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
